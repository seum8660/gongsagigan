name: 기상청 자료 갱신
on:
  schedule:
    - cron: '0 18 1 * *'   # 매월 2일 03:00 (한국시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-kma.mjs
        env:
          KMA_KEY: ${{ secrets.KMA_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add wx.json
          git diff --staged --quiet || git commit -m "기상 자료 갱신 $(date +%F)"
          git push
